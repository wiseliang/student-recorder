name: Build test APK
on:
  push:
    branches: [master, feat/random-templates-overview-fix, feature/v1.8-academic]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/check-version.cjs
      - run: npm test
      - name: Set up pinned Android SDK command tools
        shell: bash
        run: |
          sdk_dir="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk_dir/cmdline-tools"
          curl -fL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$sdk_dir/cmdline-tools"
          mv "$sdk_dir/cmdline-tools/cmdline-tools" "$sdk_dir/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk_dir" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_dir" >> "$GITHUB_ENV"
          echo "$sdk_dir/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          python3 - "$sdk_dir" <<'PYTHON'
          import subprocess,sys
          sdk=sys.argv[1]
          subprocess.run([sdk+'/cmdline-tools/latest/bin/sdkmanager','--sdk_root='+sdk,'--licenses'],input='y\n'*200,text=True,check=True)
          PYTHON
      - name: Install Android components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.1.10909125' 'cmake;3.22.1'
      - name: Build signed standalone release APK
        working-directory: android
        env:
          EXPO_PUBLIC_API_BASE_URL: https://wiseliang.cloud/student-recorder
        run: bash gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: student-recorder-apk
          path: android/app/build-final/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
